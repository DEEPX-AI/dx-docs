name: guard

# modules/ and common/ are copies. Edits must go to the source repo.
on:
  pull_request:
    paths:
      - "modules/**"
      - "common/**"

jobs:
  block-manual-edits:
    runs-on: ubuntu-latest
    steps:
      - name: Reject edits to collected docs
        if: github.actor != 'github-actions[bot]'
        run: |
          echo "::error::modules/ and common/ are synced copies. Please fix the document in its source repo (see .source.json in each folder)."
          exit 1
