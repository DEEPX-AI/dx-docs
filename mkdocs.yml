site_name: SDK Docs
site_description: Compile, run and ship AI models on DEEPX NPUs.
site_url: https://developer.deepx.ai/tech-docs/
repo_url: https://github.com/DEEPX-AI/dx-docs
edit_uri: edit/main/docs/
watch:
  - snippets

theme:
  name: material
  features:
    - content.action.edit
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - navigation.path
    - navigation.footer
    - navigation.instant
    - navigation.instant.progress
    - toc.follow
    - search.highlight
    - search.suggest
    - search.share
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  favicon: assets/logo.avif
  logo: assets/logo.avif

extra_css:
  - assets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/DEEPX-AI
    - icon: fontawesome/solid/globe
      link: https://deepx.ai
    - icon: fontawesome/solid/comments
      link: https://community.deepx.ai/
      name: DEEPX Developer Community

copyright: "&copy; 2026 DEEPX Co., Ltd."

plugins:
  - search
  - minify:
      minify_html: true
  - llmstxt:
      full_output: llms-full.txt
      sections:
        Get started:
          - index.md
          - get-started/*.md
        Compiler:
          - compiler/*.md
        Runtime:
          - runtime/*.md
        Tools:
          - tools/*.md
          - tools/**/*.md
        Tutorials:
          - tutorials/*.md
        Reference:
          - reference/*.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - md_in_html

